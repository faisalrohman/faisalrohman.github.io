  CARA SETUP:
  1. Buat Google Spreadsheet baru
  2. Rename sheet menjadi "Signatures"
  3. Baris 1 (header): ID | Dokumen | Penandatangan | Jabatan | Timestamp | Status
  4. Klik Extensions > Apps Script

function doPost(e) {
  try {
    const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Signatures');
    
    if (!sheet) {
      return ContentService.createTextOutput(JSON.stringify({
        success: false,
        error: 'Sheet "Signatures" not found'
      })).setMimeType(ContentService.MimeType.JSON);
    }
    
    const data = JSON.parse(e.postData.contents);
    
    if (data.action === 'create') {
      sheet.appendRow([
        data.signature_id,
        data.document_name,
        data.signer_name,
        data.signer_position,
        data.timestamp,
        data.status || 'valid'
      ]);
      
      return ContentService.createTextOutput(JSON.stringify({
        success: true,
        message: 'Signature created'
      })).setMimeType(ContentService.MimeType.JSON);
      
    } else if (data.action === 'update') {
      const values = sheet.getDataRange().getValues();
      let updated = false;
      
      for (let i = 1; i < values.length; i++) {
        if (values[i][0] === data.signature_id) {
          sheet.getRange(i + 1, 6).setValue(data.status);
          updated = true;
          break;
        }
      }
      
      return ContentService.createTextOutput(JSON.stringify({
        success: updated,
        message: updated ? 'Status updated' : 'Signature not found'
      })).setMimeType(ContentService.MimeType.JSON);
    }
    
    return ContentService.createTextOutput(JSON.stringify({
      success: false,
      error: 'Invalid action'
    })).setMimeType(ContentService.MimeType.JSON);
    
  } catch (error) {
    return ContentService.createTextOutput(JSON.stringify({
      success: false,
      error: error.toString()
    })).setMimeType(ContentService.MimeType.JSON);
  }
}

function doGet(e) {
  try {
    const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Signatures');
    
    if (!sheet) {
      return ContentService.createTextOutput(JSON.stringify({
        success: false,
        error: 'Sheet "Signatures" not found',
        data: []
      })).setMimeType(ContentService.MimeType.JSON);
    }
    
    const values = sheet.getDataRange().getValues();
    const data = [];
    
    for (let i = 1; i < values.length; i++) {
      if (values[i][0]) {
        data.push({
          signature_id: values[i][0],
          document_name: values[i][1],
          signer_name: values[i][2],
          signer_position: values[i][3],
          timestamp: values[i][4],
          status: values[i][5] || 'valid'
        });
      }
    }
    
    return ContentService.createTextOutput(JSON.stringify({
      success: true,
      data: data
    })).setMimeType(ContentService.MimeType.JSON);
    
  } catch (error) {
    return ContentService.createTextOutput(JSON.stringify({
      success: false,
      error: error.toString(),
      data: []
    })).setMimeType(ContentService.MimeType.JSON);
  }
}

  <script>
    // ⚠️ GANTI URL INI DENGAN URL APPS SCRIPT ANDA
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxBSiKFoSl8MqmluhwbjX8j_7vlJM7kxzEp5FmFno-9tyR4gYizOFJs2d6agz48myba/exec';
    
    let signatures = [];
    let isLoading = false;
    let isLoggedIn = false;
    
    const ADMIN_USERNAME = 'admine';
    const ADMIN_PASSWORD = 'adminttd';
    const LOGO_URL = 'https://blogger.googleusercontent.com/img/a/AVvXsEjjINzUrLqjW0r_V3PERAPmCZmh5EzTUmCaLlTlOqiVEY-HAylPbPVOGwYo-u7Ob2Qe914Ql7oebQvqJsC9XnpKUhPEdA576pUITGT6MN68RgpyTI_72-M3U7TMSTfDCbAPriU4kn1EeTIW__WGJteBgnOEyjA5uwJYCaXJ-RqS4u7LBh-7wLm44yd-cLq-';
    const APP_URL = 'https://faisalrohman.github.io/cek-dokumen.html';
    
    // Load data from Google Sheets
    async function loadData() {
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const result = await response.json();
        
        if (result.success) {
          signatures = result.data || [];
          renderHistory();
        }
      } catch (error) {
        console.error('Error loading data:', error);
      }
    }
    
    // Create signature in Google Sheets
    async function createSignature(data) {
      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'create',
            ...data
          })
        });
        
        const result = await response.json();
        return result.success;
      } catch (error) {
        console.error('Error creating signature:', error);
        return false;
      }
    }
    
    // Update signature status in Google Sheets
    async function updateSignatureStatus(signatureId, status) {
      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'update',
            signature_id: signatureId,
            status: status
          })
        });
        
        const result = await response.json();
        return result.success;
      } catch (error) {
        console.error('Error updating signature:', error);
        return false;
      }
    }
    
    async function initializeApp() {
      await loadData();
      
      const urlParams = new URLSearchParams(window.location.search);
      const signatureId = urlParams.get('id');
      
      if (signatureId) {
        switchTab('verify');
        document.getElementById('verify-tab-btn').classList.add('active');
        document.getElementById('signatureId').value = signatureId;
        
        let attempts = 0;
        const maxAttempts = 20;
        
        const checkAndVerify = setInterval(() => {
          attempts++;
          
          if (signatures.length > 0 || attempts >= maxAttempts) {
            clearInterval(checkAndVerify);
            
            setTimeout(() => {
              const verifyBtn = document.getElementById('verify-btn');
              if (verifyBtn && !isLoading) {
                verifyBtn.click();
              }
            }, 300);
          }
        }, 200);
      }
    }
    
    function addLogoToQR(container) {
      setTimeout(() => {
        if (container.querySelector('.qr-logo-overlay')) return;
        
        const logoDiv = document.createElement('div');
        logoDiv.className = 'qr-logo-overlay';
        
        const logoImg = document.createElement('img');
        logoImg.src = LOGO_URL;
        logoImg.alt = 'Logo';
        logoImg.onerror = function() {
          logoDiv.style.display = 'none';
        };
        
        logoDiv.appendChild(logoImg);
        container.appendChild(logoDiv);
      }, 100);
    }
    
    function switchTab(tabName) {
      if (!isLoggedIn && (tabName === 'create' || tabName === 'history')) {
        return;
      }
      
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      if (event && event.target) {
        event.target.classList.add('active');
      } else {
        const tabBtn = document.getElementById(tabName + '-tab-btn');
        if (tabBtn) tabBtn.classList.add('active');
      }
      
      document.getElementById(tabName).classList.add('active');
      
      if (tabName === 'history') {
        loadData();
      }
    }
    
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      
      if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
        isLoggedIn = true;
        
        document.getElementById('create-tab-btn').classList.remove('hidden');
        document.getElementById('history-tab-btn').classList.remove('hidden');
        document.getElementById('login-tab-btn').classList.add('hidden');
        document.getElementById('logoutBtn').style.display = 'block';
        
        switchTab('verify');
        document.getElementById('verify-tab-btn').classList.add('active');
        
        document.getElementById('loginForm').reset();
        errorDiv.style.display = 'none';
      } else {
        errorDiv.textContent = 'Username atau password salah!';
        errorDiv.style.display = 'block';
      }
    });
    
    document.getElementById('logoutBtn').addEventListener('click', () => {
      isLoggedIn = false;
      
      document.getElementById('create-tab-btn').classList.add('hidden');
      document.getElementById('history-tab-btn').classList.add('hidden');
      document.getElementById('login-tab-btn').classList.remove('hidden');
      document.getElementById('logoutBtn').style.display = 'none';
      
      switchTab('verify');
      document.getElementById('verify-tab-btn').classList.add('active');
    });
    
    function generateId() {
      return 'SIG-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9).toUpperCase();
    }
    
    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (isLoading) return;
      
      const documentName = document.getElementById('documentName').value;
      const signerName = document.getElementById('signerName').value;
      const signerPosition = document.getElementById('signerPosition').value;
      const signatureId = generateId();
      const timestamp = new Date().toISOString();
      
      const generateBtn = document.getElementById('generate-btn');
      generateBtn.disabled = true;
      generateBtn.innerHTML = '<span class="loading"></span>';
      isLoading = true;
      
      const signatureData = {
        signature_id: signatureId,
        document_name: documentName,
        signer_name: signerName,
        signer_position: signerPosition,
        timestamp: timestamp,
        status: 'valid'
      };
      
      const success = await createSignature(signatureData);
      
      if (success) {
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';
        qrContainer.style.position = 'relative';
        
        const qrUrl = `${APP_URL}?id=${signatureId}`;
        
        new QRCode(qrContainer, {
          text: qrUrl,
          width: 200,
          height: 200,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H
        });
        
        addLogoToQR(qrContainer);
        
        document.getElementById('signatureIdDisplay').textContent = signatureId;
        document.getElementById('qrResult').style.display = 'block';
        
        document.getElementById('createForm').reset();
        
        await loadData();
      } else {
        showToast('Gagal membuat tanda tangan. Silakan coba lagi.', 'error');
      }
      
      generateBtn.disabled = false;
      generateBtn.innerHTML = '<span id="generate-btn-text">Generate QR Code</span>';
      isLoading = false;
    });
    
    document.getElementById('verifyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (isLoading) return;
      
      const signatureId = document.getElementById('signatureId').value.trim();
      const verifyBtn = document.getElementById('verify-btn');
      
      verifyBtn.disabled = true;
      verifyBtn.innerHTML = '<span class="loading"></span>';
      isLoading = true;
      
      await new Promise(resolve => setTimeout(resolve, 500));
      
      const signature = signatures.find(sig => sig.signature_id === signatureId);
      
      const resultDiv = document.getElementById('verifyResult');
      
      if (signature) {
        const date = new Date(signature.timestamp);
        let statusClass = 'valid';
        let statusText = 'VALID';
        let statusLabel = '✓ Tanda Tangan Valid';
        let statusColor = '#28a745';
        
        if (signature.status === 'frozen') {
          statusClass = 'frozen';
          statusText = 'DIBEKUKAN';
          statusLabel = '⚠ Tanda Tangan Dibekukan';
          statusColor = '#856404';
        } else if (signature.status === 'cancelled') {
          statusClass = 'invalid';
          statusText = 'DIBATALKAN';
          statusLabel = '✗ Tanda Tangan Dibatalkan';
          statusColor = '#dc3545';
        }
        
        resultDiv.className = `verify-result ${statusClass}`;
        resultDiv.innerHTML = `
          <h3>${statusLabel}</h3>
          <div class="signature-details">
            <div class="detail-row">
              <span class="detail-label">ID Tanda Tangan:</span>
              <span class="detail-value">${signature.signature_id}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Nama Dokumen:</span>
              <span class="detail-value">${signature.document_name}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Penandatangan:</span>
              <span class="detail-value">${signature.signer_name}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Jabatan:</span>
              <span class="detail-value">${signature.signer_position || '-'}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Tanggal:</span>
              <span class="detail-value">${date.toLocaleDateString('id-ID', { 
                day: 'numeric', 
                month: 'long', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
              })}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Status:</span>
              <span class="detail-value" style="color: ${statusColor}; font-weight: bold;">${statusText}</span>
            </div>
          </div>
        `;
      } else {
        resultDiv.className = 'verify-result invalid';
        resultDiv.innerHTML = `
          <h3>✗ Tanda Tangan Tidak Valid</h3>
          <p>ID tanda tangan tidak ditemukan dalam sistem. Pastikan ID yang Anda masukkan benar.</p>
        `;
      }
      
      resultDiv.style.display = 'block';
      
      verifyBtn.disabled = false;
      verifyBtn.innerHTML = '<span id="verify-btn-text">Verifikasi Tanda Tangan</span>';
      isLoading = false;
    });
    
    async function updateStatus(signature, newStatus) {
      const success = await updateSignatureStatus(signature.signature_id, newStatus);
      
      if (success) {
        showToast(`Status berhasil diubah menjadi ${newStatus.toUpperCase()}`, 'success');
        await loadData();
      } else {
        showToast('Gagal mengubah status. Silakan coba lagi.', 'error');
      }
    }
    
    function printQrCode(signature) {
      const modalQrCode = document.getElementById('modalQrCode');
      modalQrCode.innerHTML = '';
      modalQrCode.style.position = 'relative';
      
      const qrUrl = `${APP_URL}?id=${signature.signature_id}`;
      
      new QRCode(modalQrCode, {
        text: qrUrl,
        width: 250,
        height: 250,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
      
      addLogoToQR(modalQrCode);
      
      document.getElementById('modalTitle').textContent = signature.document_name;
      document.getElementById('modalSignatureId').textContent = signature.signature_id;
      document.getElementById('qrModal').classList.add('active');
    }
    
    function closeQrModal() {
      document.getElementById('qrModal').classList.remove('active');
    }
    
    function renderHistory() {
      const historyList = document.getElementById('historyList');
      
      if (signatures.length === 0) {
        historyList.innerHTML = `
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <h3>Belum Ada Riwayat</h3>
            <p>Tanda tangan digital yang Anda buat akan muncul di sini</p>
          </div>
        `;
        return;
      }
      
      const sortedSignatures = [...signatures].sort((a, b) => 
        new Date(b.timestamp) - new Date(a.timestamp)
      );
      
      historyList.innerHTML = sortedSignatures.map(sig => {
        const date = new Date(sig.timestamp);
        let statusClass = 'status-valid';
        let statusText = 'VALID';
        
        if (sig.status === 'frozen') {
          statusClass = 'status-frozen';
          statusText = 'DIBEKUKAN';
        } else if (sig.status === 'cancelled') {
          statusClass = 'status-cancelled';
          statusText = 'DIBATALKAN';
        }
        
        return `
          <div class="history-item">
            <div class="history-header">
              <div class="history-title">${sig.document_name}</div>
              <span class="history-status ${statusClass}">${statusText}</span>
            </div>
            <div class="history-info">
              <div><strong>Penandatangan:</strong> ${sig.signer_name}</div>
              <div><strong>Jabatan:</strong> ${sig.signer_position || '-'}</div>
              <div><strong>ID:</strong> ${sig.signature_id}</div>
              <div><strong>Tanggal:</strong> ${date.toLocaleDateString('id-ID', { 
                day: 'numeric', 
                month: 'long', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
              })}</div>
            </div>
            <div class="history-actions">
              <button class="btn btn-secondary" onclick='printQrCode(${JSON.stringify(sig).replace(/'/g, "&apos;")})'>
                Cetak QR
              </button>
              ${sig.status !== 'valid' ? `
                <button class="btn btn-success" onclick='updateStatus(${JSON.stringify(sig).replace(/'/g, "&apos;")}, "valid")'>
                  Set Valid
                </button>
              ` : ''}
              ${sig.status !== 'frozen' ? `
                <button class="btn btn-warning" onclick='updateStatus(${JSON.stringify(sig).replace(/'/g, "&apos;")}, "frozen")'>
                  Bekukan
                </button>
              ` : ''}
              ${sig.status !== 'cancelled' ? `
                <button class="btn btn-danger" onclick='updateStatus(${JSON.stringify(sig).replace(/'/g, "&apos;")}, "cancelled")'>
                  Batalkan
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }
    
    function showToast(message, type) {
      const toast = document.createElement('div');
      toast.className = `verify-result ${type === 'error' ? 'invalid' : 'valid'}`;
      toast.innerHTML = `<h3>${message}</h3>`;
      toast.style.position = 'fixed';
      toast.style.top = '20px';
      toast.style.left = '50%';
      toast.style.transform = 'translateX(-50%)';
      toast.style.zIndex = '2000';
      toast.style.maxWidth = '500px';
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.remove();
      }, 3000);
    }
    
    function exportHistory() {
      if (signatures.length === 0) {
        showToast('Tidak ada riwayat untuk di-export', 'error');
        return;
      }
      
      let csv = 'ID Tanda Tangan,Nama Dokumen,Penandatangan,Jabatan,Tanggal,Status\n';
      
      signatures.forEach(sig => {
        const date = new Date(sig.timestamp);
        const formattedDate = date.toLocaleDateString('id-ID', {
          day: 'numeric',
          month: 'long',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
        
        const status = sig.status === 'valid' ? 'VALID' : 
                      sig.status === 'frozen' ? 'DIBEKUKAN' : 'DIBATALKAN';
        
        csv += `"${sig.signature_id}","${sig.document_name}","${sig.signer_name}","${sig.signer_position || '-'}","${formattedDate}","${status}"\n`;
      });
      
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      
      const now = new Date();
      const filename = `riwayat-tanda-tangan-${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}.csv`;
      
      link.setAttribute('href', url);
      link.setAttribute('download', filename);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      
      showToast('Riwayat berhasil di-export!', 'success');
    }
    
    initializeApp();
  </script>
