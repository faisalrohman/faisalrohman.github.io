<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarik Tambang Matematika</title>
  <!-- Memuat Tailwind CSS untuk styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Menggunakan font Inter */
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Memastikan font Inter dimuat */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    /* Custom style untuk penanda tali */
    #rope-marker {
      transition: left 0.3s ease-in-out;
      transform: translate(-50%, -50%);
      /* Ukuran diperkecil */
      width: 2rem; /* 32px */
      height: 2rem; /* 32px */
      border-radius: 9999px; /* Bulat penuh */
      background-color: #facc15; /* yellow-400 */
      border: 3px solid #ca8a04; /* yellow-600 */
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      z-index: 10;
    }

    /* Style untuk area tali */
    #rope-container {
      background-color: #967259; /* Warna coklat tali */
      height: 8px;
      border-radius: 5px;
      position: relative;
    }
    
    /* Karakter pemain (emoji) - ukuran diperkecil */
    .player-avatar {
      font-size: 4rem; /* 64px */
      line-height: 1;
    }
    
    /* Media query untuk layar lebih besar (sm) */
    @media (min-width: 640px) {
      .player-avatar {
        font-size: 5rem; /* 80px */
      }
      #rope-marker {
        width: 2.5rem; /* 40px */
        height: 2.5rem; /* 40px */
      }
    }

    /* Overlay untuk hitung mundur */
    #countdown-overlay {
      background-color: rgba(255, 255, 255, 0.9);
      z-index: 50;
    }
    #countdown-text {
      font-size: 8rem;
      font-weight: bold;
      color: #1d4ed8; /* blue-700 */
      animation: pulse-fade 1s ease-in-out infinite;
    }
    @keyframes pulse-fade {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }
  </style>
</head>
<body class="bg-sky-100 min-h-screen flex flex-col justify-between p-4 font-inter">

  <!-- Kontainer Utama -->
  <main class="flex-grow flex items-center justify-center">

    <!-- 1. Layar Pilihan Mode (Tampil di awal) -->
    <div id="mode-selection-screen" class="bg-white w-full max-w-lg p-6 sm:p-8 rounded-2xl shadow-xl text-center">
      <h1 class="text-3xl sm:text-4xl font-bold text-gray-800 mb-2">
        Tarik Tambang Matematika
      </h1>
      <h2 class="text-xl sm:text-2xl font-semibold text-gray-600 mb-6 sm:mb-8">
        Pilih Mode Permainan
      </h2>
      <div class="grid grid-cols-3 gap-3 sm:gap-4">
        <button onclick="selectMode('+')" class="mode-btn p-4 sm:p-6 rounded-xl bg-gray-100 hover:bg-blue-100 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <span class="text-4xl sm:text-5xl font-bold text-blue-600">+</span>
          <span class="block text-sm sm:text-base font-medium text-gray-700 mt-1">Tambah</span>
        </button>
        <button onclick="selectMode('-')" class="mode-btn p-4 sm:p-6 rounded-xl bg-gray-100 hover:bg-red-100 focus:outline-none focus:ring-2 focus:ring-red-400">
          <span class="text-4xl sm:text-5xl font-bold text-red-600">−</span>
          <span class="block text-sm sm:text-base font-medium text-gray-700 mt-1">Kurang</span>
        </button>
        <button onclick="selectMode('x')" class="mode-btn p-4 sm:p-6 rounded-xl bg-gray-100 hover:bg-green-100 focus:outline-none focus:ring-2 focus:ring-green-400">
          <span class="text-4xl sm:text-5xl font-bold text-green-600">×</span>
          <span class="block text-sm sm:text-base font-medium text-gray-700 mt-1">Kali</span>
        </button>
        <button onclick="selectMode('÷')" class="mode-btn p-4 sm:p-6 rounded-xl bg-gray-100 hover:bg-yellow-100 focus:outline-none focus:ring-2 focus:ring-yellow-400">
          <span class="text-4xl sm:text-5xl font-bold text-yellow-600">÷</span>
          <span class="block text-sm sm:text-base font-medium text-gray-700 mt-1">Bagi</span>
        </button>
        <button onclick="selectMode('campuran')" class="mode-btn col-span-2 p-4 sm:p-6 rounded-xl bg-gray-100 hover:bg-indigo-100 focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <span class="text-4xl sm:text-5xl font-bold text-indigo-600">?</span>
          <span class="block text-sm sm:text-base font-medium text-gray-700 mt-1">Campuran</span>
        </button>
      </div>
    </div>

    <!-- 2. Overlay Hitung Mundur (Default tersembunyi) -->
    <div id="countdown-overlay" class="hidden fixed inset-0 flex items-center justify-center">
      <div id="countdown-text">3</div>
    </div>

    <!-- 3. Wrapper Kontainer Game (Default tersembunyi) -->
    <div id="game-container-wrapper" class="hidden w-full">
      <div class="bg-white w-full max-w-5xl p-4 sm:p-8 rounded-2xl shadow-xl text-center mx-auto">
        
        <!-- Judul Game -->
        <h1 class="text-2xl sm:text-4xl font-bold text-gray-800 mb-2">
          Tarik Tambang Matematika
        </h1>
        <p id="message-area" class="text-base sm:text-lg text-gray-600 mb-4 sm:mb-6">
          Jawab soal untuk menarik tali!
        </p>

        <!-- Kontainer Utama Game -->
        <div id="game-container" class="flex flex-col lg:flex-row items-center justify-around w-full gap-4 sm:gap-8">

          <!-- Pemain 1 (Kiri) -->
          <div id="player1-card" class="bg-blue-800 p-3 sm:p-4 rounded-2xl shadow-lg w-full max-w-[280px] sm:max-w-xs">
            <!-- Soal -->
            <div id="player1-problem" class="text-white text-2xl sm:text-3xl font-bold mb-3 h-9 sm:h-10 flex items-center justify-center">
              ? + ? = ?
            </div>
            <!-- Input Jawaban -->
            <input type="text" id="player1-answer" class="w-full p-2 sm:p-3 rounded-lg text-right text-2xl sm:text-3xl text-black mb-3 pointer-events-none bg-gray-100" readonly>
            <!-- Tombol Angka (diperkecil) -->
            <div class="grid grid-cols-3 gap-2 sm:gap-3">
              <button onclick="handleInput(1, '1')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-300">1</button>
              <button onclick="handleInput(1, '2')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-300">2</button>
              <button onclick="handleInput(1, '3')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-300">3</button>
              <button onclick="handleInput(1, '4')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-300">4</button>
              <button onclick="handleInput(1, '5')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-300">5</button>
              <button onclick="handleInput(1, '6')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-300">6</button>
              <button onclick="handleInput(1, '7')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-300">7</button>
              <button onclick="handleInput(1, '8')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-300">8</button>
              <button onclick="handleInput(1, '9')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-300">9</button>
              <button onclick="handleInput(1, 'C')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-red-600 text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-300">C</button>
              <button onclick="handleInput(1, '0')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-300">0</button>
              <button onclick="handleInput(1, 'Go')" class="calc-btn go-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-green-600 text-white hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-300">Go</button>
            </div>
          </div>

          <!-- Visual Tarik Tambang -->
          <div id="game-visual" class="flex items-center justify-center w-full lg:w-auto px-4 my-4 lg:my-0">
            <span class="player-avatar">🧍‍♂️</span>
            <div id="rope-container" class="w-32 sm:w-48 lg:w-64 mx-[-8px] relative">
              <div id="rope-marker" class="absolute top-1/2" style="left: 50%;"></div>
            </div>
            <!-- Karakter kedua diputar horizontal -->
            <span class="player-avatar transform -scale-x-100">🧍‍♂️</span> 
          </div>

          <!-- Pemain 2 (Kanan) -->
          <div id="player2-card" class="bg-red-800 p-3 sm:p-4 rounded-2xl shadow-lg w-full max-w-[280px] sm:max-w-xs">
            <!-- Soal -->
            <div id="player2-problem" class="text-white text-2xl sm:text-3xl font-bold mb-3 h-9 sm:h-10 flex items-center justify-center">
              ? + ? = ?
            </div>
            <!-- Input Jawaban -->
            <input type="text" id="player2-answer" class="w-full p-2 sm:p-3 rounded-lg text-right text-2xl sm:text-3xl text-black mb-3 pointer-events-none bg-gray-100" readonly>
            <!-- Tombol Angka (diperkecil) -->
            <div class="grid grid-cols-3 gap-2 sm:gap-3">
              <button onclick="handleInput(2, '1')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-red-300">1</button>
              <button onclick="handleInput(2, '2')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-red-300">2</button>
              <button onclick="handleInput(2, '3')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-red-300">3</button>
              <button onclick="handleInput(2, '4')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-red-300">4</button>
              <button onclick="handleInput(2, '5')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-red-300">5</button>
              <button onclick="handleInput(2, '6')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-red-300">6</button>
              <button onclick="handleInput(2, '7')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-red-300">7</button>
              <button onclick="handleInput(2, '8')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-red-300">8</button>
              <button onclick="handleInput(2, '9')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-red-300">9</button>
              <button onclick="handleInput(2, 'C')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-red-600 text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-300">C</button>
              <button onclick="handleInput(2, '0')" class="calc-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-white text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-red-300">0</button>
              <button onclick="handleInput(2, 'Go')" class="calc-btn go-btn p-3 sm:p-3.5 rounded-lg text-xl sm:text-2xl font-bold bg-green-600 text-white hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-300">Go</button>
            </div>
          </div>
        </div>

        <!-- Tombol Mulai Game Baru -->
        <button id="new-game-btn" 
                onclick="backToMenu()" 
                class="hidden mt-6 sm:mt-8 px-5 py-2.5 sm:px-6 sm:py-3 bg-blue-600 text-white text-base sm:text-lg font-semibold rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400">
          Pilih Mode Lain
        </button>
      </div>
    </div>
  </main>

  <!-- 4. Footer -->
  <footer class="w-full text-center p-4 mt-8">
    <p class="text-sm text-gray-600">
      dibuat oleh Faisal Rohman, S.Pd. (@hanyauntukmu)
    </p>
  </footer>

  <script>
    // --- Referensi Elemen DOM ---
    const player1ProblemEl = document.getElementById('player1-problem');
    const player1AnswerEl = document.getElementById('player1-answer');
    const player2ProblemEl = document.getElementById('player2-problem');
    const player2AnswerEl = document.getElementById('player2-answer');
    
    const ropeMarkerEl = document.getElementById('rope-marker');
    const messageEl = document.getElementById('message-area');
    const newGameBtn = document.getElementById('new-game-btn');
    const allCalcButtons = document.querySelectorAll('.calc-btn');
    
    // Elemen baru
    const modeSelectionScreen = document.getElementById('mode-selection-screen');
    const countdownOverlay = document.getElementById('countdown-overlay');
    const countdownTextEl = document.getElementById('countdown-text');
    const gameContainerWrapper = document.getElementById('game-container-wrapper');


    // --- State Game ---
    let player1Problem = { a: 0, b: 0, answer: 0, op: '+' };
    let player2Problem = { a: 0, b: 0, answer: 0, op: '+' };
    let ropePercent = 50; // Posisi awal tali (50%)
    let gameIsOver = false;
    let currentGameMode = '+'; // Mode default
    
    const ROPE_PULL_AMOUNT = 10; // Tarikan per jawaban benar (10%)
    const MAX_NUMBER_ADD_SUB = 20; // Angka maks untuk tambah/kurang (1-20)
    const MAX_NUMBER_MULT = 12; // Angka maks untuk kali (1-12)
    const MAX_ANSWER_DIV = 12; // Angka maks untuk hasil bagi (1-12)

    const WIN_THRESHOLD_P1 = 5; // Batas menang P1 (misal 5%)
    const WIN_THRESHOLD_P2 = 95; // Batas menang P2 (misal 95%)

    /**
     * Memilih mode dan memulai hitung mundur
     */
    function selectMode(mode) {
      currentGameMode = mode;
      modeSelectionScreen.classList.add('hidden');
      countdownOverlay.classList.remove('hidden');
      startCountdown();
    }

    /**
     * Memulai hitung mundur 3 detik
     */
    function startCountdown() {
      let count = 3;
      countdownTextEl.textContent = count;
      
      const interval = setInterval(() => {
        count--;
        if (count > 0) {
          countdownTextEl.textContent = count;
        } else if (count === 0) {
          countdownTextEl.textContent = 'Mulai!';
          countdownTextEl.style.fontSize = '5rem'; // Perkecil teks "Mulai!"
        } else {
          clearInterval(interval);
          countdownOverlay.classList.add('hidden');
          gameContainerWrapper.classList.remove('hidden');
          countdownTextEl.textContent = '3'; // Reset untuk game selanjutnya
          countdownTextEl.style.fontSize = '8rem';
          newGame(); // Memulai game setelah hitung mundur
        }
      }, 1000);
    }

    /**
     * Menghasilkan soal matematika berdasarkan mode
     */
    function generateProblem() {
      let a = 0, b = 0, answer = 0, op = '+';
      let mode = currentGameMode;

      if (mode === 'campuran') {
        const modes = ['+', '-', 'x', '÷'];
        mode = modes[Math.floor(Math.random() * modes.length)];
      }

      switch (mode) {
        case '+':
          a = Math.floor(Math.random() * MAX_NUMBER_ADD_SUB) + 1;
          b = Math.floor(Math.random() * MAX_NUMBER_ADD_SUB) + 1;
          answer = a + b;
          op = '+';
          break;
        case '-':
          // Pastikan a >= b agar tidak negatif
          a = Math.floor(Math.random() * MAX_NUMBER_ADD_SUB) + 1;
          b = Math.floor(Math.random() * a) + 1; // b <= a
          answer = a - b;
          op = '−'; // Karakter minus
          break;
        case 'x':
          a = Math.floor(Math.random() * MAX_NUMBER_MULT) + 1;
          b = Math.floor(Math.random() * MAX_NUMBER_MULT) + 1;
          answer = a * b;
          op = '×'; // Karakter kali
          break;
        case '÷':
          // Buat jawaban non-nol terlebih dahulu
          b = Math.floor(Math.random() * MAX_ANSWER_DIV) + 1; // Pembagi (1-12)
          answer = Math.floor(Math.random() * MAX_ANSWER_DIV) + 1; // Hasil (1-12)
          a = b * answer; // Pastikan bisa dibagi habis
          op = '÷'; // Karakter bagi
          break;
      }
      return { a, b, answer, op };
    }

    /**
     * Memperbarui UI soal untuk pemain
     */
    function nextRound(playerNum) {
      if (gameIsOver) return;
      
      const problem = generateProblem();

      if (playerNum === 1) {
        player1Problem = problem;
        player1ProblemEl.textContent = `${problem.a} ${problem.op} ${problem.b} = ?`;
        player1AnswerEl.value = '';
      } else {
        player2Problem = problem;
        player2ProblemEl.textContent = `${problem.a} ${problem.op} ${problem.b} = ?`;
        player2AnswerEl.value = '';
      }
    }

    /**
     * Memperbarui posisi visual penanda tali
     */
    function updateRopeVisual() {
      // Membatasi posisi tali antara 0% dan 100%
      ropePercent = Math.max(0, Math.min(100, ropePercent));
      ropeMarkerEl.style.left = `${ropePercent}%`;
      checkWin();
    }

    /**
     * Memeriksa kondisi kemenangan
     */
    function checkWin() {
      if (gameIsOver) return;

      if (ropePercent <= WIN_THRESHOLD_P1) {
        showWinner(1);
      } else if (ropePercent >= WIN_THRESHOLD_P2) {
        showWinner(2);
      }
    }

    /**
     * Menampilkan pemenang dan mengakhiri game
     */
    function showWinner(playerNum) {
      gameIsOver = true;
      if (playerNum === 1) {
        messageEl.textContent = 'Pemain 1 (Biru) Menang!';
        ropeMarkerEl.style.left = '0%';
      } else {
        messageEl.textContent = 'Pemain 2 (Merah) Menang!';
        ropeMarkerEl.style.left = '100%';
      }
      
      // Tampilkan tombol "Pilih Mode Lain"
      newGameBtn.classList.remove('hidden');

      // Nonaktifkan tombol
      allCalcButtons.forEach(btn => btn.disabled = true);
    }

    /**
     * Menangani input dari tombol kalkulator
     */
    function handleInput(playerNum, value) {
      if (gameIsOver) return;

      const answerEl = (playerNum === 1) ? player1AnswerEl : player2AnswerEl;

      if (value === 'C') {
        answerEl.value = '';
      } else if (value === 'Go') {
        handleSubmit(playerNum);
      } else {
        // Batasi panjang input (misal 4 digit)
        if (answerEl.value.length < 4) {
          answerEl.value += value;
        }
      }
    }

    /**
     * Menangani saat pemain menekan "Go" (Jawab)
     */
    function handleSubmit(playerNum) {
      if (gameIsOver) return;

      const answerEl = (playerNum === 1) ? player1AnswerEl : player2AnswerEl;
      const problem = (playerNum === 1) ? player1Problem : player2Problem;
      
      const submittedAnswer = parseInt(answerEl.value, 10);

      if (isNaN(submittedAnswer)) return; // Abaikan jika input kosong

      if (submittedAnswer === problem.answer) {
        // Jawaban benar
        if (playerNum === 1) {
          ropePercent -= ROPE_PULL_AMOUNT;
        } else {
          ropePercent += ROPE_PULL_AMOUNT;
        }
        updateRopeVisual();
        if (!gameIsOver) {
          nextRound(playerNum); // Beri soal baru ke pemain yang benar
        }
      } else {
        // Jawaban salah, goyangkan input
        answerEl.classList.add('animate-shake');
        // Hapus animasi after selesai
        setTimeout(() => {
          answerEl.classList.remove('animate-shake');
          answerEl.value = ''; // Kosongkan jawaban salah
        }, 500);
      }
    }

    /**
     * Memulai game baru (dipanggil setelah hitung mundur)
     */
    function newGame() {
      gameIsOver = false;
      ropePercent = 50;
      messageEl.textContent = 'Jawab soal untuk menarik tali!';
      newGameBtn.classList.add('hidden');
      
      // Aktifkan kembali semua tombol
      allCalcButtons.forEach(btn => btn.disabled = false);
      
      updateRopeVisual();
      nextRound(1);
      nextRound(2);
    }
    
    /**
     * Kembali ke menu pilihan mode
     */
    function backToMenu() {
      gameContainerWrapper.classList.add('hidden');
      modeSelectionScreen.classList.remove('hidden');
      newGameBtn.classList.add('hidden'); // Sembunyikan tombol "Pilih Mode"
    }
    
    // --- Inisialisasi ---
    // Menambahkan animasi shake
    const styleSheet = document.createElement("style");
    styleSheet.type = "text/css";
    styleSheet.innerText = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
        20%, 40%, 60%, 80% { transform: translateX(5px); }
      }
      .animate-shake {
        animation: shake 0.5s ease-in-out;
      }
    `;
    document.head.appendChild(styleSheet);

    // Game tidak dimulai otomatis, menunggu pilihan mode.
  </script>
</body>
</html>
