<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarik Tambang Matematika</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Menggunakan font Inter */
    body {
      font-family: 'Inter', sans-serif;
      /* Mencegah zoom/scroll saat disentuh (penting untuk multi-touch) */
      touch-action: manipulation;
    }
    /* Memastikan font Inter dimuat */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    /* Custom style untuk penanda tali (BOM) */
    #rope-marker {
      transition: left 0.3s ease-in-out;
      transform: translate(-50%, -50%);
      z-index: 10;
      /* Ukuran bom diatur oleh class text- di HTML */
    }

    /* Style untuk area tali */
    #rope-container {
      background-color: #967259; /* Warna coklat tali */
      height: 8px;
      border-radius: 5px;
      position: relative;
    }
    
    /* Karakter pemain (emoji) - ukuran diperkecil */
    .player-avatar {
      font-size: 4rem; /* 64px */
      line-height: 1;
    }
    
    /* Media query untuk layar lebih besar (sm) */
    @media (min-width: 640px) {
      .player-avatar {
        font-size: 5rem; /* 80px */
      }
      #rope-marker {
        /* Ukuran bom disesuaikan di HTML */
      }
    }

    /* Overlay untuk hitung mundur */
    #countdown-overlay {
      background-color: rgba(255, 255, 255, 0.9);
      z-index: 50;
    }
    #countdown-text {
      font-size: 8rem;
      font-weight: bold;
      color: #1d4ed8; /* blue-700 */
      animation: pulse-fade 1s ease-in-out infinite;
    }
    @keyframes pulse-fade {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }
    
    /* Animasi Ledakan */
    @keyframes kaboom {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.5); opacity: 1; }
      100% { transform: scale(1.2); opacity: 0; }
    }
    .animate-kaboom {
      animation: kaboom 0.5s ease-out;
    }

    /* Umpan balik visual untuk tombol multi-touch */
    .calc-btn {
      transition: transform 0.05s ease-out;
      /* Mencegah seleksi teks saat tombol ditekan cepat */
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }
    .calc-btn-active {
       transform: scale(0.92);
       background-color: #d1d5db; /* gray-300 */
    }

  </style>
</head>

  <script>
    // --- Referensi Elemen DOM ---
    const player1ProblemEl = document.getElementById('player1-problem');
    const player1AnswerEl = document.getElementById('player1-answer');
    const player2ProblemEl = document.getElementById('player2-problem');
    const player2AnswerEl = document.getElementById('player2-answer');
    
    const ropeMarkerEl = document.getElementById('rope-marker');
    const messageEl = document.getElementById('message-area');
    const newGameBtn = document.getElementById('new-game-btn');
    const allCalcButtons = document.querySelectorAll('.calc-btn'); // Tetap digunakan untuk menonaktifkan
    
    // Elemen baru
    const modeSelectionScreen = document.getElementById('mode-selection-screen');
    const countdownOverlay = document.getElementById('countdown-overlay');
    const countdownTextEl = document.getElementById('countdown-text');
    const gameContainerWrapper = document.getElementById('game-container-wrapper');
    const explosionP1El = document.getElementById('explosion-p1'); // Baru
    const explosionP2El = document.getElementById('explosion-p2'); // Baru
    const pairingScreen = document.getElementById('pairing-screen'); // BARU
    const roomCodeDisplayEl = document.getElementById('room-code-display'); // BARU
    const joinCodeInputEl = document.getElementById('join-code-input'); // BARU


    // --- State Game ---
    let player1Problem = { a: 0, b: 0, answer: 0, op: '+' };
    let player2Problem = { a: 0, b: 0, answer: 0, op: '+' };
    let ropePercent = 50; // Posisi awal tali (50%)
    let gameIsOver = false;
    let currentGameMode = '+'; // Mode default
    
    const ROPE_PULL_AMOUNT = 10; // Dorongan per jawaban benar (10%)
    const MAX_NUMBER_ADD_SUB = 20; // Angka maks untuk tambah/kurang (1-20)
    const MAX_NUMBER_MULT = 12; // Angka maks untuk kali (1-12)
    const MAX_ANSWER_DIV = 12; // Angka maks untuk hasil bagi (1-12)

    // Logika batas dibalik: 5% adalah sisi P1, 95% adalah sisi P2
    const WIN_THRESHOLD_P1_LOSES = 5; // Jika bom di <= 5%, P1 kalah
    const WIN_THRESHOLD_P2_LOSES = 95; // Jika bom di >= 95%, P2 kalah
    
    // --- Audio Context untuk Suara ---
    let audioCtx;
    
    function initAudio() {
      // Inisialisasi AudioContext saat interaksi pertama (penting untuk browser)
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          console.error("Web Audio API is not supported in this browser");
        }
      }
    }

    function playExplosionSound() {
      if (!audioCtx) return; // Jangan lakukan apa-apa jika audio gagal
      
      try {
        // Membuat white noise
        const bufferSize = audioCtx.sampleRate * 0.5; // 0.5 detik
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1; // Noise
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        // Kontrol volume (fade out)
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

        // Filter untuk efek "boom" (low-pass)
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        
        noise.start(audioCtx.currentTime);
        noise.stop(audioCtx.currentTime + 0.5);
      } catch (e) {
        console.error("Error playing sound:", e);
      }
    }
    // --- Akhir Audio Context ---


    // --- BARU: Logika Layar Pairing (Placeholder) ---
    function showPairingScreen() {
      modeSelectionScreen.classList.add('hidden');
      pairingScreen.classList.remove('hidden');
    }

    function backToMenuFromPairing() {
      pairingScreen.classList.add('hidden');
      modeSelectionScreen.classList.remove('hidden');
    }

    function createRoom() {
      // TODO: Ini adalah placeholder.
      // Di sini Anda perlu memanggil server backend Anda (misal Firebase)
      // untuk membuat ID room unik.
      const fakeRoomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
      roomCodeDisplayEl.textContent = fakeRoomCode;
      alert(`(Placeholder) Room ${fakeRoomCode} dibuat. Fitur ini memerlukan backend.`);
      // Setelah room dibuat, Anda akan menunggu pemain lain bergabung via backend.
    }

    function joinRoom() {
      // TODO: Ini adalah placeholder.
      // Di sini Anda perlu memanggil server backend Anda
      // untuk bergabung ke room dengan kode dari 'joinCodeInputEl.value'.
      const code = joinCodeInputEl.value;
      if (!code) {
        alert("Masukkan kode room terlebih dahulu.");
        return;
      }
      alert(`(Placeholder) Mencoba bergabung ke room ${code}. Fitur ini memerlukan backend.`);
      // Jika berhasil, backend akan memberi sinyal untuk memulai game.
      // Anda bisa memanggil startCountdown() dari sini.
    }
    // --- Akhir Logika Layar Pairing ---


    /**
     * Memilih mode dan memulai hitung mundur
     */
    function selectMode(mode) {
      initAudio(); // Inisialisasi audio saat pengguna klik mode
      currentGameMode = mode;
      modeSelectionScreen.classList.add('hidden');
      countdownOverlay.classList.remove('hidden');
      startCountdown();
    }

    /**
     * Memulai hitung mundur 3 detik
     */
    function startCountdown() {
      let count = 3;
      countdownTextEl.textContent = count;
      
      const interval = setInterval(() => {
        count--;
        if (count > 0) {
          countdownTextEl.textContent = count;
        } else if (count === 0) {
          countdownTextEl.textContent = 'Mulai!';
          countdownTextEl.style.fontSize = '5rem'; // Perkecil teks "Mulai!"
        } else {
          clearInterval(interval);
          countdownOverlay.classList.add('hidden');
          gameContainerWrapper.classList.remove('hidden');
          countdownTextEl.textContent = '3'; // Reset untuk game selanjutnya
          countdownTextEl.style.fontSize = '8rem';
          newGame(); // Memulai game setelah hitung mundur
        }
      }, 1000);
    }

    /**
     * Menghasilkan soal matematika berdasarkan mode
     */
    function generateProblem() {
      let a = 0, b = 0, answer = 0, op = '+';
      let mode = currentGameMode;

      if (mode === 'campuran') {
        const modes = ['+', '-', 'x', '÷'];
        mode = modes[Math.floor(Math.random() * modes.length)];
      }

      switch (mode) {
        case '+':
          a = Math.floor(Math.random() * MAX_NUMBER_ADD_SUB) + 1;
          b = Math.floor(Math.random() * MAX_NUMBER_ADD_SUB) + 1;
          answer = a + b;
          op = '+';
          break;
        case '-':
          // Pastikan a >= b agar tidak negatif
          a = Math.floor(Math.random() * MAX_NUMBER_ADD_SUB) + 1;
          b = Math.floor(Math.random() * a) + 1; // b <= a
          answer = a - b;
          op = '−'; // Karakter minus
          break;
        case 'x':
          a = Math.floor(Math.random() * MAX_NUMBER_MULT) + 1;
          b = Math.floor(Math.random() * MAX_NUMBER_MULT) + 1;
          answer = a * b;
          op = '×'; // Karakter kali
          break;
        case '÷':
          // Buat jawaban non-nol terlebih dahulu
          b = Math.floor(Math.random() * MAX_ANSWER_DIV) + 1; // Pembagi (1-12)
          answer = Math.floor(Math.random() * MAX_ANSWER_DIV) + 1; // Hasil (1-12)
          a = b * answer; // Pastikan bisa dibagi habis
          op = '÷'; // Karakter bagi
          break;
      }
      return { a, b, answer, op };
    }

    /**
     * Memperbarui UI soal untuk pemain
     */
    function nextRound(playerNum) {
      if (gameIsOver) return;
      
      const problem = generateProblem();

      if (playerNum === 1) {
        player1Problem = problem;
        player1ProblemEl.textContent = `${problem.a} ${problem.op} ${problem.b} = ?`;
        player1AnswerEl.value = '';
      } else {
        player2Problem = problem;
        player2ProblemEl.textContent = `${problem.a} ${problem.op} ${problem.b} = ?`;
        player2AnswerEl.value = '';
      }
    }

    /**
     * Memperbarui posisi visual penanda tali
     */
    function updateRopeVisual() {
      // Membatasi posisi tali antara 0% dan 100%
      ropePercent = Math.max(0, Math.min(100, ropePercent));
      ropeMarkerEl.style.left = `${ropePercent}%`;
      checkWin();
    }

    /**
     * Memeriksa kondisi kemenangan (sekarang kondisi KALAH)
     */
    function checkWin() {
      if (gameIsOver) return;

      // P1 (kiri) akan mendorong bom ke kanan (menambah ropePercent)
      // P2 (kanan) akan mendorong bom ke kiri (mengurangi ropePercent)

      if (ropePercent <= WIN_THRESHOLD_P1_LOSES) {
        // Bom ada di sisi P1. P1 Kalah. P2 Menang.
        showWinner(2);
      } else if (ropePercent >= WIN_THRESHOLD_P2_LOSES) {
        // Bom ada di sisi P2. P2 Kalah. P1 Menang.
        showWinner(1);
      }
    }

    /**
     * Menampilkan pemenang dan Memicu Ledakan pada yang Kalah
     * @param {number} playerNum - Nomor pemain yang MENANG
     */
    function showWinner(playerNum) {
      gameIsOver = true;
      playExplosionSound(); // Mainkan suara ledakan

      if (playerNum === 1) {
        // P1 Menang, P2 Kalah (Meledak)
        messageEl.textContent = 'Pemain 1 (Biru) Menang!';
        ropeMarkerEl.style.left = '100%'; // Pindahkan bom ke sisi P2
        explosionP2El.classList.remove('hidden'); // Tampilkan ledakan P2
        explosionP2El.classList.add('animate-kaboom');
        
      } else {
        // P2 Menang, P1 Kalah (Meledak)
        messageEl.textContent = 'Pemain 2 (Merah) Menang!';
        ropeMarkerEl.style.left = '0%'; // Pindahkan bom ke sisi P1
        explosionP1El.classList.remove('hidden'); // Tampilkan ledakan P1
        explosionP1El.classList.add('animate-kaboom');
      }
      
      // Tampilkan tombol "Pilih Mode Lain"
      newGameBtn.classList.remove('hidden');

      // Nonaktifkan tombol
      allCalcButtons.forEach(btn => btn.disabled = true);
    }

    /**
     * Menangani input dari tombol kalkulator (dipanggil oleh touch listener)
     */
    function handleInput(playerNum, value) {
      if (gameIsOver) return;

      const answerEl = (playerNum === 1) ? player1AnswerEl : player2AnswerEl;

      if (value === 'C') {
        answerEl.value = '';
      } else if (value === 'Go') {
        handleSubmit(playerNum);
      } else {
        // Batasi panjang input (misal 4 digit)
        if (answerEl.value.length < 4) {
          answerEl.value += value;
        }
      }
    }

    /**
     * Menangani saat pemain menekan "Go" (Jawab)
     */
    function handleSubmit(playerNum) {
      if (gameIsOver) return;

      const answerEl = (playerNum === 1) ? player1AnswerEl : player2AnswerEl;
      const problem = (playerNum === 1) ? player1Problem : player2Problem;
      
      const submittedAnswer = parseInt(answerEl.value, 10);

      if (isNaN(submittedAnswer)) return; // Abaikan jika input kosong

      if (submittedAnswer === problem.answer) {
        // Jawaban benar
        if (playerNum === 1) {
          // P1 (kiri) mendorong bom ke KANAN (menjauh)
          ropePercent += ROPE_PULL_AMOUNT;
        } else {
          // P2 (kanan) mendorong bom ke KIRI (menjauh)
          ropePercent -= ROPE_PULL_AMOUNT;
        }
        updateRopeVisual();
        if (!gameIsOver) {
          nextRound(playerNum); // Beri soal baru ke pemain yang benar
        }
      } else {
        // Jawaban salah, goyangkan input
        answerEl.classList.add('animate-shake');
        // Hapus animasi after selesai
        setTimeout(() => {
          answerEl.classList.remove('animate-shake');
          answerEl.value = ''; // Kosongkan jawaban salah
        }, 500);
      }
    }

    /**
     * Memulai game baru (dipanggil setelah hitung mundur)
     */
    function newGame() {
      gameIsOver = false;
      ropePercent = 50;
      messageEl.textContent = 'Jawab soal untuk mendorong bom!';
      newGameBtn.classList.add('hidden');
      
      // Sembunyikan dan reset ledakan
      explosionP1El.classList.add('hidden');
      explosionP2El.classList.add('hidden');
      explosionP1El.classList.remove('animate-kaboom');
      explosionP2El.classList.remove('animate-kaboom');
      
      // Aktifkan kembali semua tombol
      allCalcButtons.forEach(btn => btn.disabled = false);
      
      updateRopeVisual();
      nextRound(1);
      nextRound(2);
    }
    
    /**
     * Kembali ke menu pilihan mode
     */
    function backToMenu() {
      gameContainerWrapper.classList.add('hidden');
      modeSelectionScreen.classList.remove('hidden');
      newGameBtn.classList.add('hidden'); // Sembunyikan tombol "Pilih Mode"
      
      // Sembunyikan dan reset ledakan
      explosionP1El.classList.add('hidden');
      explosionP2El.classList.add('hidden');
      explosionP1El.classList.remove('animate-kaboom');
      explosionP2El.classList.remove('animate-kaboom');
    }
    
    // --- BARU: Inisialisasi Listener Multi-Touch ---
    function setupCalculatorTouch() {
      const buttons = document.querySelectorAll('.calc-btn');

      buttons.forEach(btn => {
        // Event saat jari MENYENTUH tombol
        btn.addEventListener('touchstart', (e) => {
          // Mencegah 'click' event dan zoom/scroll
          e.preventDefault(); 
          
          // Beri umpan balik visual
          btn.classList.add('calc-btn-active');
          
          // Panggil fungsi handleInput jika game belum selesai
          if (!gameIsOver) {
            const player = parseInt(btn.dataset.player, 10);
            const value = btn.dataset.value;
            handleInput(player, value);
          }
        }, { passive: false }); // {passive: false} diperlukan untuk e.preventDefault()

        // Event saat jari DIANGKAT dari tombol
        const releaseButton = () => {
          btn.classList.remove('calc-btn-active');
        };
        
        btn.addEventListener('touchend', releaseButton);
        btn.addEventListener('touchcancel', releaseButton); // Jika sentuhan dibatalkan (misal oleh sistem)
      });
    }

    // --- Inisialisasi ---
    // Menambahkan animasi shake
    const styleSheet = document.createElement("style");
    styleSheet.type = "text/css";
    styleSheet.innerText = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
        20%, 40%, 60%, 80% { transform: translateX(5px); }
      }
      .animate-shake {
        animation: shake 0.5s ease-in-out;
      }
    `;
    document.head.appendChild(styleSheet);

    // BARU: Panggil fungsi setup multi-touch
    setupCalculatorTouch();

    // Game tidak dimulai otomatis, menunggu pilihan mode.
  </script>
</body>
</html>
